<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Debug Test</title>
</head>
<body>
    <h1>Console Debug Test</h1>
    <p>Open browser console (F12) and you should see debug messages immediately.</p>
    
    <div id="status">Testing...</div>
    
    <script>
        console.log('🔥 IMMEDIATE TEST: Console is working!');
        console.log('🕐 Time:', new Date().toISOString());
        console.log('🌐 Location:', window.location.href);
        console.log('📱 User Agent:', navigator.userAgent);
        
        // Test the API config debugging
        console.group('🧪 API CONFIG TEST');
        console.log('NODE_ENV:', 'production'); // Simulating production
        console.log('API URL Test:', 'https://backend-prod-team-jobhatchs-projects.vercel.app/api');
        console.groupEnd();
        
        // Test fetch debugging
        console.group('🔗 FETCH TEST');
        console.log('Testing backend connection...');
        
        fetch('https://backend-prod-team-jobhatchs-projects.vercel.app/api/health')
            .then(response => {
                console.log('✅ Backend Response Status:', response.status);
                console.log('📊 Response OK:', response.ok);
                return response.json();
            })
            .then(data => {
                console.log('📄 Backend Response Data:', data);
                document.getElementById('status').innerHTML = '✅ Backend is responding!';
            })
            .catch(error => {
                console.error('❌ Backend Error:', error);
                document.getElementById('status').innerHTML = '❌ Backend is not responding!';
            });
        
        console.groupEnd();
        
        // Test if the debugging functions would work
        window.testDebugging = function() {
            console.log('🧪 Manual debugging test triggered');
            console.log('🎯 This confirms JavaScript execution is working');
        };
        
        console.log('🎯 Test complete! If you see this, console logging is working.');
        console.log('📞 To run manual test, type: testDebugging()');
    </script>
</body>
</html>
